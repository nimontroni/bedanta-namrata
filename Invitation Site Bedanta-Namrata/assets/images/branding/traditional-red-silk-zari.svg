<svg xmlns="http://www.w3.org/2000/svg" width="540" height="760" viewBox="0 0 540 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Microscopic Traditional Red Silk Twill Weave Texture -->
    <pattern id="silkWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#B51220"/>
      <!-- Diagonal silk warp threads in rich vermilion -->
      <path d="M 0 0 L 4 4 M 4 0 L 8 4 M 0 4 L 4 8 M 4 4 L 8 8" stroke="#C91B24" stroke-width="0.85" fill="none" opacity="0.75"/>
      <!-- Cross diagonal weft threads in deep crimson -->
      <path d="M 4 0 L 0 4 M 8 0 L 4 4 M 4 4 L 0 8 M 8 4 L 4 8" stroke="#920D19" stroke-width="0.75" fill="none" opacity="0.80"/>
      <!-- Fine silk luster slubs reflecting ambient light -->
      <rect x="2" y="2" width="1" height="1" fill="rgba(255, 240, 200, 0.12)"/>
      <rect x="6" y="6" width="1" height="1" fill="rgba(255, 240, 200, 0.12)"/>
      <rect x="1" y="5" width="1" height="1" fill="rgba(255, 255, 255, 0.06)"/>
      <rect x="5" y="1" width="1" height="1" fill="rgba(255, 255, 255, 0.06)"/>
    </pattern>

    <!-- Antique Zari Gold Gradient -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C77B" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D5A84B" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#B88628" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8C77B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Light Golden Thread Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5A84B" stop-opacity="0.80"/>
      <stop offset="50%" stop-color="#F3DC9B" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFF2CE" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Soft Zari Thread Relief / Raised Embroidery Shadow -->
    <filter id="zariRelief" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="0.8" flood-color="#4D050B" flood-opacity="0.75"/>
    </filter>

    <!-- ===================================================================
         A. SMALL SCATTERED MOTIF (Chhoti Buti / Tora-Buta)
         Matches the exact scattered 4-pointed diamond star butis in the photo
         =================================================================== -->
    <g id="chhotiButi" filter="url(#zariRelief)">
      <!-- Central 4-pointed golden diamond star -->
      <polygon points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="url(#antiqueGold)"/>
      <circle cx="0" cy="0" r="1.2" fill="url(#goldHighlight)"/>
      <!-- 4 Cardinal satellite gold dots / zari stitches -->
      <circle cx="0" cy="-8.5" r="1.0" fill="url(#goldHighlight)"/>
      <circle cx="0" cy="8.5" r="1.0" fill="url(#goldHighlight)"/>
      <circle cx="-8.5" cy="0" r="1.0" fill="url(#goldHighlight)"/>
      <circle cx="8.5" cy="0" r="1.0" fill="url(#goldHighlight)"/>
      <!-- 4 Diagonal micro-dots -->
      <circle cx="-4.5" cy="-4.5" r="0.6" fill="url(#antiqueGold)" opacity="0.85"/>
      <circle cx="4.5" cy="-4.5" r="0.6" fill="url(#antiqueGold)" opacity="0.85"/>
      <circle cx="-4.5" cy="4.5" r="0.6" fill="url(#antiqueGold)" opacity="0.85"/>
      <circle cx="4.5" cy="4.5" r="0.6" fill="url(#antiqueGold)" opacity="0.85"/>
    </g>

    <!-- ===================================================================
         B & C. ELABORATE ORNAMENTAL KALKA MOTIF (Paan-Kalka Medallion)
         Matches the prominent decorated pallu panel in the reference photo
         =================================================================== -->
    <g id="kalkaMedallion" filter="url(#zariRelief)">
      <!-- Outer Teardrop / Paisley Kalka Contour with beaded pearl rim -->
      <path d="M 0,-34 C 4,-26 18,-18 22,-4 C 25,10 16,24 0,32 C -16,24 -25,10 -22,-4 C -18,-18 -4,-26 0,-34 Z" 
            fill="none" stroke="url(#antiqueGold)" stroke-width="1.5" opacity="0.88"/>
      
      <!-- Inner Scalloped / Beaded Pearl Border -->
      <path d="M 0,-30 C 3.2,-23 15,-16 18.5,-3.5 C 21,9 13.5,21 0,28 C -13.5,21 -21,9 -18.5,-3.5 C -15,-16 -3.2,-23 0,-30 Z" 
            fill="none" stroke="url(#goldHighlight)" stroke-width="0.8" stroke-dasharray="2,2.2" opacity="0.9"/>

      <!-- Curved Top Crest / Finial -->
      <path d="M 0,-34 C 1.5,-38 5,-41 8,-40 C 6,-38 4,-35 0,-34 Z" fill="url(#goldHighlight)"/>
      <circle cx="8.5" cy="-40.5" r="1.1" fill="url(#goldHighlight)"/>

      <!-- Interior Brocade Lotus Blossom at Base (পদ্ম ফুল) -->
      <path d="M 0,26 C -3,20 -7,14 0,7 C 7,14 3,20 0,26 Z" fill="url(#antiqueGold)" opacity="0.92"/>
      <path d="M 0,24 C -6,22 -12,16 -7,9 C -3,13 -1,18 0,24 Z" fill="url(#antiqueGold)" opacity="0.85"/>
      <path d="M 0,24 C 6,22 12,16 7,9 C 3,13 1,18 0,24 Z" fill="url(#antiqueGold)" opacity="0.85"/>
      
      <!-- Climbing Symmetrical Floral Vines (Lota) -->
      <path d="M -2,7 C -7,2 -13,-4 -11,-12 C -8,-10 -5,-7 -2,-4" fill="none" stroke="url(#goldHighlight)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 2,7 C 7,2 13,-4 11,-12 C 8,-10 5,-7 2,-4" fill="none" stroke="url(#goldHighlight)" stroke-width="1.1" stroke-linecap="round"/>

      <!-- Upper Paisley Bud Flares -->
      <circle cx="-11" cy="-12.5" r="1.6" fill="url(#goldHighlight)"/>
      <circle cx="11" cy="-12.5" r="1.6" fill="url(#goldHighlight)"/>
      <circle cx="-6" cy="-20" r="1.4" fill="url(#antiqueGold)"/>
      <circle cx="6" cy="-20" r="1.4" fill="url(#antiqueGold)"/>

      <!-- Central Golden Core / Jewel -->
      <circle cx="0" cy="6" r="3" fill="url(#goldHighlight)"/>
      <circle cx="0" cy="6" r="1.5" fill="#C91B24"/>
      <circle cx="0" cy="-6" r="2.2" fill="url(#antiqueGold)"/>
      <circle cx="0" cy="-16" r="1.7" fill="url(#goldHighlight)"/>
      
      <!-- Perimeter Pearl Beads -->
      <circle cx="0" cy="33" r="1.2" fill="url(#goldHighlight)"/>
      <circle cx="-9" cy="28" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="9" cy="28" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="-17" cy="20" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="17" cy="20" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="-22" cy="9" r="1.1" fill="url(#goldHighlight)"/>
      <circle cx="22" cy="9" r="1.1" fill="url(#goldHighlight)"/>
      <circle cx="-21" cy="-5" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="21" cy="-5" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="-14" cy="-17" r="1.1" fill="url(#antiqueGold)"/>
      <circle cx="14" cy="-17" r="1.1" fill="url(#antiqueGold)"/>
    </g>

    <!-- Intermediate Medium Floral Floret -->
    <g id="mediumFloret" filter="url(#zariRelief)">
      <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3" fill="url(#antiqueGold)"/>
      <circle cx="0" cy="0" r="2.2" fill="url(#goldHighlight)"/>
      <circle cx="0" cy="-11" r="1.0" fill="url(#goldHighlight)"/>
      <circle cx="0" cy="11" r="1.0" fill="url(#goldHighlight)"/>
      <circle cx="-11" cy="0" r="1.0" fill="url(#goldHighlight)"/>
      <circle cx="11" cy="0" r="1.0" fill="url(#goldHighlight)"/>
    </g>

    <!-- ===================================================================
         D. DECORATIVE WOVEN LOWER BORDER (Paar Section)
         Matches the exact border band at the bottom of the reference photo
         =================================================================== -->
    <pattern id="borderChevronPattern" width="24" height="20" patternUnits="userSpaceOnUse">
      <!-- Stepped Chevron / Triangle Zari Weave -->
      <polygon points="12,2 24,18 0,18" fill="none" stroke="url(#antiqueGold)" stroke-width="1.2"/>
      <polygon points="12,6 20,16 4,16" fill="url(#antiqueGold)" opacity="0.38"/>
      <circle cx="12" cy="11" r="1.3" fill="url(#goldHighlight)"/>
      <circle cx="12" cy="2" r="1" fill="url(#goldHighlight)"/>
    </pattern>

    <pattern id="borderDotRows" width="8" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="3" r="1.1" fill="url(#goldHighlight)"/>
      <circle cx="4" cy="9" r="1.1" fill="url(#antiqueGold)"/>
    </pattern>
  </defs>

  <!-- ===================================================================
       1. BASE RED SILK FABRIC WITH NATURAL WEAVE GRAIN
       =================================================================== -->
  <rect width="540" height="760" fill="url(#silkWeave)"/>

  <!-- ===================================================================
       2. SCATTERED CHHOTI BUTIS (Zone A)
       Evenly distributed across the red silk body with elegant quincunx rhythm
       =================================================================== -->
  <g class="scattered-butis" opacity="0.90">
    <!-- Outer Left Flank Columns -->
    <use href="#chhotiButi" x="22" y="90"/>
    <use href="#chhotiButi" x="22" y="160"/>
    <use href="#chhotiButi" x="22" y="230"/>
    <use href="#chhotiButi" x="22" y="300"/>
    <use href="#chhotiButi" x="22" y="370"/>
    <use href="#chhotiButi" x="22" y="440"/>
    <use href="#chhotiButi" x="22" y="510"/>
    <use href="#chhotiButi" x="22" y="580"/>

    <use href="#chhotiButi" x="95" y="125"/>
    <use href="#chhotiButi" x="95" y="195"/>
    <use href="#chhotiButi" x="95" y="265"/>
    <use href="#chhotiButi" x="95" y="335"/>
    <use href="#chhotiButi" x="95" y="405"/>
    <use href="#chhotiButi" x="95" y="475"/>
    <use href="#chhotiButi" x="95" y="545"/>
    <use href="#chhotiButi" x="95" y="615"/>

    <!-- Outer Right Flank Columns -->
    <use href="#chhotiButi" x="518" y="90"/>
    <use href="#chhotiButi" x="518" y="160"/>
    <use href="#chhotiButi" x="518" y="230"/>
    <use href="#chhotiButi" x="518" y="300"/>
    <use href="#chhotiButi" x="518" y="370"/>
    <use href="#chhotiButi" x="518" y="440"/>
    <use href="#chhotiButi" x="518" y="510"/>
    <use href="#chhotiButi" x="518" y="580"/>

    <use href="#chhotiButi" x="445" y="125"/>
    <use href="#chhotiButi" x="445" y="195"/>
    <use href="#chhotiButi" x="445" y="265"/>
    <use href="#chhotiButi" x="445" y="335"/>
    <use href="#chhotiButi" x="445" y="405"/>
    <use href="#chhotiButi" x="445" y="475"/>
    <use href="#chhotiButi" x="445" y="545"/>
    <use href="#chhotiButi" x="445" y="615"/>

    <!-- Top Area Accents around Toran and Header -->
    <use href="#chhotiButi" x="150" y="55"/>
    <use href="#chhotiButi" x="390" y="55"/>
    <use href="#chhotiButi" x="160" y="115"/>
    <use href="#chhotiButi" x="380" y="115"/>
    <use href="#chhotiButi" x="145" y="175"/>
    <use href="#chhotiButi" x="395" y="175"/>

    <!-- Lower Area Accents framing Bedanta weds Namrata and Date Pill -->
    <use href="#chhotiButi" x="55" y="650"/>
    <use href="#chhotiButi" x="140" y="640"/>
    <use href="#chhotiButi" x="400" y="640"/>
    <use href="#chhotiButi" x="485" y="650"/>
  </g>

  <!-- ===================================================================
       3. ELABORATE WOVEN KALKA MEDALLIONS (Zone B & C - Pallu Panel)
       Golden paisley-lotus medallions centered within the visible flanks
       =================================================================== -->
  <g class="ornamental-kalkas" opacity="0.94">
    <!-- Left Flank Column of Kalka Medallions -->
    <use href="#kalkaMedallion" x="58" y="230"/>
    <use href="#kalkaMedallion" x="58" y="370"/>
    <use href="#kalkaMedallion" x="58" y="510"/>

    <!-- Right Flank Column of Kalka Medallions -->
    <use href="#kalkaMedallion" x="482" y="230"/>
    <use href="#kalkaMedallion" x="482" y="370"/>
    <use href="#kalkaMedallion" x="482" y="510"/>

    <!-- Top Corner Accent Florets (Traditional Corner Kalkas / Borfi) -->
    <use href="#mediumFloret" x="58" y="55"/>
    <use href="#mediumFloret" x="482" y="55"/>
  </g>

  <!-- ===================================================================
       4. DECORATIVE WOVEN ZARI LOWER BORDER (Zone D - Paar)
       Matches the lower border band in the reference photo
       =================================================================== -->
  <g class="lower-zari-border" transform="translate(0, 672)">
    <!-- Top Double Gold Zari Hairline -->
    <line x1="0" y1="0" x2="540" y2="0" stroke="url(#antiqueGold)" stroke-width="1.4"/>
    <line x1="0" y1="3" x2="540" y2="3" stroke="url(#goldHighlight)" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Dense Rows of Golden Stitched Zari Dots (Tika Paar) -->
    <rect x="0" y="6" width="540" height="12" fill="url(#borderDotRows)"/>

    <!-- Mid Border Separator Line -->
    <line x1="0" y1="20" x2="540" y2="20" stroke="url(#antiqueGold)" stroke-width="1"/>

    <!-- Chevron / Diamond Brocade Band -->
    <rect x="0" y="22" width="540" height="20" fill="url(#borderChevronPattern)"/>

    <!-- Lower Separator Line -->
    <line x1="0" y1="44" x2="540" y2="44" stroke="url(#antiqueGold)" stroke-width="1"/>

    <!-- Bottom Rows of Stitched Zari Dots -->
    <rect x="0" y="46" width="540" height="12" fill="url(#borderDotRows)"/>

    <!-- Bottom Fine Gold Zari Rule -->
    <line x1="0" y1="60" x2="540" y2="60" stroke="url(#antiqueGold)" stroke-width="1.5"/>
    <line x1="0" y1="63" x2="540" y2="63" stroke="url(#goldHighlight)" stroke-width="0.8" stroke-dasharray="2,4"/>
  </g>
</svg>